    <script>"use strict";

        document.addEventListener('click', function (event) {
            const clickedButton = event.target.closest('.snack-alt');

            if (clickedButton) {
                const snackItem = clickedButton.closest('.snack-item');
                if (!snackItem) {
                    return; // Button is not within a snack-item, ignore.
                }

                const mainImage = snackItem.querySelector('.snack-img');
                const altImage = clickedButton.querySelector('.snack-alt-img');
                const altButtons = snackItem.querySelectorAll('.snack-alt');

                if (mainImage && altImage) {
                    mainImage.src = altImage.src;
                    mainImage.alt = altImage.alt;

                    altButtons.forEach(button => button.classList.remove('alt-active'));
                    clickedButton.classList.add('alt-active');
                }
            }
        });
    </script>
